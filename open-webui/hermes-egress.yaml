# Tailscale egress proxy to the Framework Desktop (tailnet name "fd").
# The Tailscale operator watches the tailnet-fqdn annotation, provisions a
# proxy StatefulSet in the tailscale namespace, and rewrites this Service's
# externalName to the proxy's in-cluster DNS. Pods reach hermes-gateway via:
#   http://hermes-egress.open-webui.svc.cluster.local:8642
# The gateway requires a bearer token (API_SERVER_KEY on the fd side), held
# in the open-webui-credentials SealedSecret and surfaced to the Pod as
# OPENAI_API_KEY by the chart. Pointing at :11435 (lemonade direct) works
# as a fallback but bypasses hermes tool-calling entirely.
apiVersion: v1
kind: Service
metadata:
  name: hermes-egress
  namespace: open-webui
  annotations:
    tailscale.com/tailnet-fqdn: fd.tailbd291c.ts.net
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - port: 8642
      protocol: TCP
