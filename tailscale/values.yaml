# Tailscale Kubernetes Operator Helm chart values
# Chart: tailscale/tailscale-operator
# Repo: https://pkgs.tailscale.com/helmcharts
#
# OAuth credentials are passed through a private local values file at install time
# (not committed to Git).

operatorConfig:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
