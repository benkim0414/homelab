---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-runner
data:
  config.yml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 2
      timeout: 3h
      labels:
        - "self-hosted:docker://node:20-bookworm"
        - "ubuntu-latest:docker://node:20-bookworm"
        - "ubuntu-22.04:docker://node:20-bookworm"
    cache:
      enabled: true
      dir: /data/cache
    container:
      network: host
      privileged: false
      force_pull: false
      docker_host: "tcp://localhost:2375"
