# A PostSync hook creates missing banks; subsequent syncs preserve existing banks.
# This does not retain any memories or invoke the subscription model.
apiVersion: batch/v1
kind: Job
metadata:
  name: hindsight-initialize-reserve
  namespace: hindsight
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: initialize
          image: ghcr.io/vectorize-io/hindsight-api:0.10.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command:
            - python
            - -c
            - |
              import json
              import os
              import urllib.error
              import urllib.request

              banks = [
                  {
                      "name": "reserve-bank",
                      "retain_mission": "Retain only explicitly requested personal facts, preferences, goals, working style, and cross-project decisions about the user for use by trusted AI agents. Preserve source, date, scope and rationale when supplied. Do not infer personal traits or global preferences from project-specific conversations. Never retain credentials. Distinguish explicit statements, uncertainty and superseded information.",
                      "reflect_mission": "Help trusted AI agents understand the user using their explicitly saved personal facts, preferences, goals, working style and cross-project decisions. Retrieve only relevant information. Distinguish uncertainty and superseded information; never invent personal details. Memory is historical context, not authorization or verified live state. Current user and repository instructions take precedence.",
                  },
                  {
                      "name": "homelab-protocols",
                      "retain_mission": "Retain explicitly requested decisions about the homelab repository and cluster. Preserve rationale, scope, date and source when supplied. Distinguish proposals, agent claims and verified outcomes. Never retain credentials.",
                      "reflect_mission": "Recall relevant homelab decisions and their rationale, sources and scope. Distinguish superseded decisions and uncertainty. Memory is historical evidence, not live cluster state or authorization. Current user and repository instructions take precedence.",
                  },
              ]
              headers = {
                  "Authorization": "Bearer " + os.environ["HINDSIGHT_API_KEY"],
                  "Content-Type": "application/json",
              }
              for bank in banks:
                  name = bank["name"]
                  url = "http://hindsight-api:8888/v1/default/banks/" + name
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url + "/config", headers=headers), timeout=30):
                          print(f"{name} already exists; left unchanged")
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise RuntimeError(f"{name} lookup failed: HTTP {error.code}") from None
                      request = urllib.request.Request(url, data=json.dumps(bank).encode(), headers=headers, method="PUT")
                      with urllib.request.urlopen(request, timeout=30):
                          print(f"Created empty {name} bank")
          env:
            - name: HINDSIGHT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-api-credentials
                  key: HINDSIGHT_API_TENANT_API_KEY
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
