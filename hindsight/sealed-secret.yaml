# Generated with the cluster public certificate; no plaintext credentials.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hindsight-db-credentials
  namespace: hindsight
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: hindsight-db-credentials
      namespace: hindsight
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hindsight-api-credentials
  namespace: hindsight
spec:
  encryptedData:
    HINDSIGHT_API_TENANT_API_KEY: 
  template:
    metadata:
      name: hindsight-api-credentials
      namespace: hindsight
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hindsight-ui-credentials
  namespace: hindsight
spec:
  encryptedData:
    HINDSIGHT_CP_DATAPLANE_API_KEY: 
  template:
    metadata:
      name: hindsight-ui-credentials
      namespace: hindsight
    type: Opaque
