apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-postgres-data
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-codex-auth
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-model-cache
  namespace: hindsight
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hindsight-backups
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: hindsight-backups
    namespace: hindsight
  mountOptions: [nfsvers=4.1]
  nfs:
    server: 192.168.0.40
    path: /k3s-storage/hindsight/backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-backups
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: hindsight-backups
  resources:
    requests:
      storage: 20Gi
