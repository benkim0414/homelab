apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hindsight-api
  namespace: hindsight
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hindsight-api
      port:
        number: 8888
  tls:
    - hosts: [hindsight-api]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hindsight
  namespace: hindsight
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hindsight-control-plane
      port:
        number: 3000
  tls:
    - hosts: [hindsight]
