---
# Per-node overrides for the replacement Mac Pro VM (.22)
#
# Proxmox VM on pve-macpro. K3s worker with Longhorn replica storage.
ansible_user: benkim0414
install_qemu_guest_agent: true
# Route host DNS through the approved resolver after LAN resolver failures.
host_dns_server: 1.1.1.1
ansible_ssh_private_key_file: ~/.ssh/pi_ed25519
ansible_ssh_common_args: "-F {{ lookup('env', 'HOME') }}/.ssh/homelab_config -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UpdateHostKeys=no"
extra_agent_args: >-
  --node-name k3s-05
  --node-ip 192.168.0.22
  --node-label node.longhorn.io/create-default-disk=true
  --node-label homelab/host=macpro
  --node-label homelab/node-class=vm
  --node-label homelab/workload-tier=heavy
