---
# Per-node overrides for rpi5-8gb-rpi-256gb (.14)
#
# .14 is the smallest control-plane node (256 GB NVMe, "nvme-medium").
# Running etcd + workloads on the same I/O path caused repeated kubelet
# crashes → force-delete cascades → Flannel IPAM exhaustion.
#
# The NoSchedule taint prevents Deployments and StatefulSets from
# scheduling here. DaemonSets with tolerations: [{operator: Exists}]
# still run (kube-vip, Flannel, MetalLB, Alloy, node-exporter, Longhorn).
extra_server_args: "--node-taint node-role.kubernetes.io/control-plane:NoSchedule"
