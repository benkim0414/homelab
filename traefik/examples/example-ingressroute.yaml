---
# Example: Host-based routing
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-web
  namespace: default
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`app.homelab.local`)
    kind: Rule
    services:
    - name: app-service
      port: 80
---
# Example: Path-based routing
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-routes
  namespace: default
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`api.homelab.local`) && PathPrefix(`/v1`)
    kind: Rule
    services:
    - name: api-v1
      port: 8080
  - match: Host(`api.homelab.local`) && PathPrefix(`/v2`)
    kind: Rule
    services:
    - name: api-v2
      port: 8080
---
# Example: HTTPS with redirect middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: default
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-redirect
  namespace: default
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`secure.homelab.local`)
    kind: Rule
    middlewares:
    - name: redirect-https
    services:
    - name: app-service
      port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-secure
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`secure.homelab.local`)
    kind: Rule
    services:
    - name: app-service
      port: 80
  tls: {}
---
# Example: Strip prefix middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-strip
  namespace: default
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`app.homelab.local`) && PathPrefix(`/api`)
    kind: Rule
    middlewares:
    - name: strip-api-prefix
    services:
    - name: backend-api
      port: 8080
