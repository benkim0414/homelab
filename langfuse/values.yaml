langfuse:
  salt:
    secretKeyRef: {name: langfuse-app-credentials, key: salt}
  encryptionKey:
    secretKeyRef: {name: langfuse-app-credentials, key: encryption-key}
  nextauth:
    url: https://langfuse.tailbd291c.ts.net
    secret:
      secretKeyRef: {name: langfuse-app-credentials, key: nextauth-secret}
  features:
    telemetryEnabled: false
    signUpDisabled: true
    experimentalFeaturesEnabled: false
  gateway:
    enabled: false
  aiFeatures:
    inAppAgent: {enabled: false}
  ingress: {enabled: false}
  serviceAccount:
    create: true
    automountServiceAccountToken: false
  image:
    tag: "4.77.0"
    pullPolicy: IfNotPresent
  replicas: 1
  nodeSelector: {kubernetes.io/arch: amd64}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
  web:
    image:
      tag: "4.77.0@sha256:2b47d0ae63ae737996a58cc03536a73230c809a2371c230c9bea4b7653a0b6a0"
    resources:
      requests: {cpu: 250m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    service: {type: ClusterIP, port: 3000}
    pod:
      additionalEnv:
        - {name: LANGFUSE_INIT_ORG_ID, value: homelab}
        - {name: LANGFUSE_INIT_ORG_NAME, value: Homelab}
        - name: LANGFUSE_INIT_USER_EMAIL
          valueFrom:
            secretKeyRef: {name: langfuse-bootstrap, key: email}
        - name: LANGFUSE_INIT_USER_PASSWORD
          valueFrom:
            secretKeyRef: {name: langfuse-bootstrap, key: password}
  worker:
    image:
      tag: "4.77.0@sha256:1bc3597ff4c953e98ff9ee474a7d634e97664e4df298fdf20f13ecc834c89438"
    resources:
      requests: {cpu: 250m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
postgresql:
  deploy: true
  serviceAccount:
    create: false
    name: langfuse
  auth:
    username: langfuse
    database: langfuse
    existingSecret: langfuse-postgresql-auth
    secretKeys: {userPasswordKey: USERDB_PASSWORD, adminPasswordKey: POSTGRES_PASSWORD}
  settings:
    existingSecret: langfuse-postgresql-auth
  userDatabase:
    existingSecret: langfuse-postgresql-auth
  image:
    repository: postgres
    tag: "18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a"
    pullPolicy: IfNotPresent
  storage:
    requestedSize: 10Gi
    className: longhorn
    persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
redis:
  deploy: true
  deploymentStrategy: Recreate
  serviceAccount:
    automount: false
  auth:
    enabled: true
    username: default
    existingSecret: langfuse-redis-auth
    existingSecretPasswordKey: default
    usersExistingSecret: langfuse-redis-auth
    aclUsers:
      default: {permissions: "~* &* +@all"}
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: "8.0@sha256:04b9002ae24bbe66687fb025052ed9bcebb54f8da3937338eb718d98d362887f"
    pullPolicy: IfNotPresent
  replica: {enabled: false, replicas: 0}
  dataStorage:
    enabled: true
    requestedSize: 5Gi
    className: longhorn
    accessModes: [ReadWriteOnce]
    keepPvc: true
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
  valkeyConfig: |
    appendonly yes
    maxmemory 384mb
    maxmemory-policy noeviction
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}
clickhouse:
  deploy: false
  host: langfuse-clickhouse
  httpPort: 8123
  nativePort: 9000
  database: default
  auth:
    username: langfuse
    existingSecret: langfuse-clickhouse-auth
    existingSecretKey: password
  cluster: {enabled: false}
  migration: {ssl: false, autoMigrate: true}
s3:
  # Raw SeaweedFS avoids the bundled chart's unconditional SFTP credential hook.
  deploy: false
  bucket: langfuse
  region: auto
  endpoint: http://langfuse-s3:8333
  forcePathStyle: true
  accessKeyId:
    secretKeyRef: {name: langfuse-s3-auth, key: accessKey}
  secretAccessKey:
    secretKeyRef: {name: langfuse-s3-auth, key: secretKey}
  eventUpload: {prefix: events/}
  # Chart currently emits media settings even when enabled=false. This is not
  # a server-side media-upload prohibition; capture=metadata is enforced at clients.
  mediaUpload:
    enabled: false
    maxContentLength: "1000000000"
  batchExport: {enabled: false}
