apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-clickhouse-data
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests: {storage: 30Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-clickhouse
  namespace: langfuse
spec:
  type: ClusterIP
  selector: {app: langfuse-clickhouse}
  ports:
    - {name: http, port: 8123, targetPort: http}
    - {name: native, port: 9000, targetPort: native}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-clickhouse
  namespace: langfuse
spec:
  serviceName: langfuse-clickhouse
  replicas: 1
  selector:
    matchLabels: {app: langfuse-clickhouse}
  template:
    metadata:
      labels: {app: langfuse-clickhouse}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      # This image needs x86-64-v3 on AMD64; the older Xeon VM lacks AVX2.
      # The Pi 5 worker exposes ARMv8.2 + LRCPC and has verified request headroom.
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: k3s-04
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: CLICKHOUSE_DB, value: default}
            - {name: CLICKHOUSE_USER, value: langfuse}
            - {name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1"}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: langfuse-clickhouse-auth, key: password}
          ports:
            - {name: http, containerPort: 8123}
            - {name: native, containerPort: 9000}
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
          startupProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
            - {name: logs, mountPath: /var/log/clickhouse-server}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: langfuse-clickhouse-data}
        - name: logs
          emptyDir: {sizeLimit: 512Mi}
