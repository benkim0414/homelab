apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
spec:
  replicas: 1
  # RWO alone does not prevent overlapping writers on the same node.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-config
          image: ghcr.io/openclaw/openclaw:2026.10.5@sha256:f40d1e66fd14d8c5b49c832f4100f83b53fdc01f5108f7db11de38fd0ee6dbe5
          command: [node, -e]
          args:
            - |
              const fs = require('node:fs');
              process.umask(0o077);
              const state = '/data/state';
              fs.mkdirSync('/data/update-captures', { recursive: true });
              fs.mkdirSync(`${state}/workspace`, { recursive: true });
              fs.mkdirSync(`${state}/.cache`, { recursive: true });
              for (const [source, destination] of [
                ['/bootstrap/openclaw.json', `${state}/openclaw.json`],
                ['/bootstrap/AGENTS.md', `${state}/workspace/AGENTS.md`]
              ]) {
                try { fs.copyFileSync(source, destination, fs.constants.COPYFILE_EXCL); }
                catch (error) { if (error.code !== 'EEXIST') throw error; }
              }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: gateway
          image: ghcr.io/openclaw/openclaw:2026.10.5@sha256:f40d1e66fd14d8c5b49c832f4100f83b53fdc01f5108f7db11de38fd0ee6dbe5
          # Preserve the official tini/Node entrypoint and its migration lock.
          args: [node, openclaw.mjs, gateway, run]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: OPENCLAW_STATE_DIR
              value: /home/node/.openclaw
            - name: XDG_CACHE_HOME
              value: /home/node/.openclaw/.cache
            - name: NODE_ENV
              value: production
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-gateway-auth
                  key: token
          ports:
            - name: gateway
              containerPort: 18789
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: '2'
              memory: 4Gi
          # Assert JSON as well as HTTP status: the UI catch-all returns 200.
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18789/startupz', r => { let b = ''; r.on('data', d => b += d); r.on('end', () => { try { const j = JSON.parse(b); process.exit(r.statusCode === 200 && j.ok === true && j.status === 'started' ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18789/startupz', r => { let b = ''; r.on('data', d => b += d); r.on('end', () => { try { const j = JSON.parse(b); process.exit(r.statusCode === 200 && j.ok === true && j.status === 'started' ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18789/healthz', r => { let b = ''; r.on('data', d => b += d); r.on('end', () => { try { process.exit(r.statusCode === 200 && JSON.parse(b).ok === true ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
              subPath: state
            # Doctor retains recovery captures beside OPENCLAW_STATE_DIR.
            - name: data
              mountPath: /home/node/.openclaw.update-captures
              subPath: update-captures
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-data
        - name: bootstrap
          configMap:
            name: openclaw-bootstrap
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
spec:
  type: ClusterIP
  selector:
    app: openclaw
  ports:
    - name: gateway
      port: 18789
      targetPort: gateway
