apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-backup
  namespace: openclaw
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-backup-recovery
  namespace: openclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-backup-control
  namespace: openclaw
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [openclaw]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [openclaw]
    verbs: [patch]
  # The lease is runtime state, created by the first runner.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [openclaw-backup]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-backup-control
  namespace: openclaw
subjects:
  - kind: ServiceAccount
    name: openclaw-backup
    namespace: openclaw
  - kind: ServiceAccount
    name: openclaw-backup-recovery
    namespace: openclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-backup-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-backup-source
  namespace: openclaw
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [openclaw-data]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-backup-source
  namespace: openclaw
subjects:
  - kind: ServiceAccount
    name: openclaw-backup
    namespace: openclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-backup-source
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-backup
  namespace: longhorn-system
rules:
  - apiGroups: [longhorn.io]
    resources: [volumes]
    resourceNames: [pvc-16e9a707-6192-4a77-b55e-c59079a3ccda]
    verbs: [get]
  - apiGroups: [longhorn.io]
    resources: [backuptargets]
    resourceNames: [default]
    verbs: [get]
  # RBAC cannot constrain create by resourceNames or restrict list/delete by
  # labels. The runner additionally validates the exact source and policy.
  - apiGroups: [longhorn.io]
    resources: [snapshots, backups]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-backup
  namespace: longhorn-system
subjects:
  - kind: ServiceAccount
    name: openclaw-backup
    namespace: openclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-backup
