[tools]
aws-cli = "latest"
kubectl = "latest"
uv = "latest"

[env]
GRAFANA_URL = "http://192.168.0.203"
ARGOCD_BASE_URL = "http://192.168.0.202"

# Secrets cached in .env.local (gitignored).
# Run `mise run secrets` to regenerate after rotation or first clone.
_.file = [".env.local"]

[tasks.secrets]
description = "Resolve Bitwarden secrets into .env.local"
run = "./scripts/env-secrets.sh"
