# Longhorn Helm chart values
# Chart: https://charts.longhorn.io
# Distributed block storage tuned for RPi5 cluster (4 nodes)

defaultSettings:
  # 2 replicas — enough for redundancy on a 4-node cluster
  defaultReplicaCount: 2
  # NFS backup target on NAS
  backupTarget: nfs://192.168.0.40:/export/longhorn-backups
  # Default 12% is too high for 4-core ARM64
  guaranteedInstanceManagerCPU: 5
  # Default 25% wastes too much on 256-500GB disks
  storageMinimalAvailablePercentage: 15
  # Disabled — ArgoCD tracks the latest chart via targetRevision: '*'
  upgradeChecker: false
  # Only create default disks on nodes explicitly labeled for storage.
  # Prevents .14's storage device from being used for volume replicas,
  # reducing I/O contention with etcd on that node.
  createDefaultDiskLabeledNodes: true

persistence:
  defaultClass: true
  defaultClassReplicaCount: 2

# Disable pre-upgrade job — required when installing via ArgoCD (chart docs)
preUpgradeChecker:
  jobEnabled: false

# Run only on nodes that participate in Longhorn storage.
# .14 has no storage label and its frequent longhorn-manager crashes
# corrupt containerd state, cascading into CreateContainerError on
# co-located DaemonSets (traefik, alloy, kube-vip).
longhornManager:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"

longhornDriver:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"

longhornUI:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

ingress:
  enabled: false
