# Longhorn Helm chart values
# Chart: https://charts.longhorn.io
# Distributed block storage tuned for RPi5 cluster (4 nodes)

defaultSettings:
  # Two replicas across the five rebuilt storage nodes.
  defaultReplicaCount: 2
  # Default 12% is too high for 4-core ARM64
  guaranteedInstanceManagerCPU: 5
  # Default 25% wastes too much on 256-500GB disks
  storageMinimalAvailablePercentage: 15
  # Version changes are reviewed through GitOps; the recovery chart is pinned.
  upgradeChecker: false
  # All rebuilt nodes with SSD storage carry this label.
  createDefaultDiskLabeledNodes: true

# NFSv4 export path verified on the NAS. Longhorn 1.13 uses this chart field.
defaultBackupStore:
  backupTarget: nfs://192.168.0.40:/longhorn-backups

persistence:
  defaultClass: true
  defaultClassReplicaCount: 2

# Disable pre-upgrade job — required when installing via ArgoCD (chart docs)
preUpgradeChecker:
  jobEnabled: false

# Run only on nodes that participate in Longhorn storage.
# The rebuilt .14 worker now has NVMe storage and participates as well.
longhornManager:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"

longhornDriver:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"

longhornUI:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

ingress:
  enabled: false
