worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Entire file is an operator-provisioned Secret, not client-controlled data.
    include /auth/identities.conf;
    server {
        listen 8080;
        client_max_body_size 100m;
        location / {
            auth_basic "Gerrit learning lab";
            auth_basic_user_file /auth/htpasswd;
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Authorization "";
            proxy_set_header X-Gerrit-User $remote_user;
            proxy_set_header X-Gerrit-Name $remote_user;
            proxy_set_header X-Gerrit-Email $gerrit_email;
            proxy_set_header X-Gerrit-ExternalId "";
        }
    }
}
