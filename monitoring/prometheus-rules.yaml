apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-cluster-rules
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: node
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="false"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is not ready"
            description: >
              Node {{ $labels.node }} has been in a NotReady state for more than 2 minutes.
              Check kubelet logs and node events for the root cause.
            runbook: "https://github.com/benkim0414/homelab/blob/main/MEMORY.md#architecture"

        - alert: NodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.node }} is under memory pressure"
            description: >
              Node {{ $labels.node }} has been reporting MemoryPressure for more than 5 minutes.
              Pod evictions may have started. Check `kubectl describe node {{ $labels.node }}`.
            runbook: "https://github.com/benkim0414/homelab/blob/main/MEMORY.md#containerd-gotchas"

        - alert: NodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.node }} is under disk pressure"
            description: >
              Node {{ $labels.node }} has been reporting DiskPressure for more than 5 minutes.
              Check disk usage with `df -h` on the node.
            runbook: "https://github.com/benkim0414/homelab/blob/main/MEMORY.md#architecture"

        - alert: NodeHighMemoryUsage
          expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} memory usage above 90%"
            description: >
              Node {{ $labels.instance }} has used more than 90% of available memory for
              over 10 minutes. Current usage: {{ $value | humanizePercentage }}.
              Review running workloads and resource limits.
            runbook: "https://github.com/benkim0414/homelab/blob/main/MEMORY.md#containerd-gotchas"

    - name: pod
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 5 > 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Container {{ $labels.container }} in pod {{ $labels.pod }} is crash looping"
            description: >
              Container {{ $labels.container }} (pod {{ $labels.pod }}, namespace {{ $labels.namespace }})
              has restarted more than 5 times in the last 15 minutes.
              Check logs: `kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} -c {{ $labels.container }} --previous`
            runbook: "https://github.com/benkim0414/homelab/blob/main/MEMORY.md#containerd-gotchas"

        - alert: PodPending
          expr: kube_pod_status_phase{phase="Pending"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} has been Pending for 15 minutes"
            description: >
              Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been stuck in
              Pending phase for over 15 minutes. Check node resources, taints/tolerations,
              and PVC binding: `kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }}`
            runbook: "https://github.com/benkim0414/homelab/blob/main/MEMORY.md#argocd-gotchas"

    - name: storage
      rules:
        - alert: PVCNotBound
          expr: kube_persistentvolumeclaim_status_phase{phase!="Bound"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} is not bound"
            description: >
              PersistentVolumeClaim {{ $labels.persistentvolumeclaim }} in namespace
              {{ $labels.namespace }} has been in phase {{ $labels.phase }} for over 5 minutes.
              Check available PVs and storage class: `kubectl describe pvc -n {{ $labels.namespace }} {{ $labels.persistentvolumeclaim }}`
            runbook: "https://github.com/benkim0414/homelab/blob/main/MEMORY.md#architecture"

        - alert: NodeDiskLow
          expr: >
            (node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} root filesystem below 15%"
            description: >
              Node {{ $labels.instance }} has less than 15% free disk space on /.
              Current available: {{ $value | humanizePercentage }}.
              Clean up unused images with `crictl rmi --prune` or containerd snapshots.
            runbook: "https://github.com/benkim0414/homelab/blob/main/MEMORY.md#containerd-gotchas"

    - name: argocd
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is OutOfSync"
            description: >
              ArgoCD application {{ $labels.name }} in project {{ $labels.project }} has been
              OutOfSync for over 10 minutes. This may indicate a manual change bypassing GitOps
              or a sync failure. Check the ArgoCD UI or run /cluster-health.
            runbook: "https://github.com/benkim0414/homelab/blob/main/MEMORY.md#argocd-gotchas"

        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is Degraded"
            description: >
              ArgoCD application {{ $labels.name }} in project {{ $labels.project }} has been
              in a Degraded health state for over 5 minutes. Investigate the failing resources
              in the ArgoCD UI or with `kubectl get events -n <namespace>`.
            runbook: "https://github.com/benkim0414/homelab/blob/main/MEMORY.md#argocd-gotchas"

    - name: cni
      rules:
        - alert: FlannelIPAMExhaustion
          expr: >
            count(increase(kube_event_count{reason="FailedCreatePodSandBox",type="Warning"}[5m]) > 0) > 3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Flannel IPAM exhaustion likely on node {{ $labels.source_host }}"
            description: |-
              More than 3 distinct FailedCreatePodSandBox events in 5 minutes on {{ $labels.source_host }}.
              This is the primary symptom of Flannel IPAM exhaustion: all IPs in a node's /24 subnet
              are held by stale lease files from force-deleted or Unknown pods. Lease files survive
              reboots — a node reboot alone will NOT fix this.

              Runbook:
              1. Find the affected node from recent events:
                 kubectl get events -A --field-selector reason=FailedCreatePodSandBox
              2. Find currently active Flannel IPs on the node (non-hostNetwork Running pods):
                 kubectl get pods -A --field-selector spec.nodeName=<node>,status.phase=Running -o wide
              3. Deploy a hostNetwork privileged cleanup pod to the node (hostNetwork bypasses IPAM):
                 kubectl run ipam-cleanup -n kube-system --restart=Never --overrides='{"spec":{"nodeName":"<node>","hostNetwork":true,"tolerations":[{"operator":"Exists"}],"containers":[{"name":"c","image":"busybox:1.36","command":["sleep","300"],"securityContext":{"privileged":true},"volumeMounts":[{"name":"h","mountPath":"/host"}]}],"volumes":[{"name":"h","hostPath":{"path":"/"}}]}}'
              4. Delete all stale leases, keeping only active IPs:
                 kubectl exec -n kube-system ipam-cleanup -- find /host/var/lib/cni/networks/cbr0 -maxdepth 1 -name '10.42.*.*' ! -name '<ip1>' ! -name '<ip2>' -delete
              5. Pods will begin scheduling immediately. Delete the cleanup pod when done.
