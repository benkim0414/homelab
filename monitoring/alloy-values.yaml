# Grafana Alloy Helm chart values
# Chart: https://grafana.github.io/helm-charts
# DaemonSet log collector, replaces deprecated Promtail

controller:
  # Allow Alloy to reschedule on .14 after the control-plane NoSchedule taint
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

alloy:
  # Alloy tails logs from every pod on its node, opening one API
  # connection per pod.  On busy nodes this triggers client-side
  # throttling and the default 1 s readiness timeout expires, causing
  # the pod to stay NotReady indefinitely despite functioning normally.
  timeoutSeconds: 5

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

  mounts:
    varlog: true

  configMap:
    content: |
      // Discover all pods on the node
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Extract useful labels from discovered pods
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        // Drop pods that are not running
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Pending|Succeeded|Failed|Completed"
          action        = "drop"
        }
      }

      // Tail log files from /var/log/pods
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.cri.receiver]
      }

      // Parse CRI log format
      loki.process "cri" {
        stage.cri {}
        forward_to = [loki.write.default.receiver]
      }

      // Push logs to Loki
      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local:80/loki/api/v1/push"
        }
      }
