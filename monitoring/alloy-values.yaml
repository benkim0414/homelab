# Grafana Alloy Helm chart values
# Chart: https://grafana.github.io/helm-charts
# DaemonSet log collector, replaces deprecated Promtail

controller:
  # Allow Alloy to reschedule on .14 after the control-plane NoSchedule taint
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

alloy:
  # Startup can still block on discovery and log tail setup on busy nodes, so
  # keep the readiness timeout above the chart default of 1 second.
  timeoutSeconds: 5

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

  mounts:
    varlog: true

  configMap:
    content: |
      // Discover all pods on the node
      discovery.kubernetes "pods" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("K8S_NODE_NAME"), constants.hostname)
        }
      }

      // Extract useful labels and local log paths from discovered pods
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          target_label  = "__path__"
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
        }
        // Drop pods that are not running
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Pending|Succeeded|Failed|Completed"
          action        = "drop"
        }
      }

      // Tail local pod log files from /var/log/pods
      loki.source.file "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.cri.receiver]
      }

      // Parse CRI log format
      loki.process "cri" {
        stage.cri {}
        forward_to = [loki.write.default.receiver]
      }

      // Push logs to Loki
      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local:80/loki/api/v1/push"
        }
      }
