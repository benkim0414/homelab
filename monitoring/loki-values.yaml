# Loki Helm chart values
# Chart: https://grafana.github.io/helm-charts
# Monolithic single-binary mode for homelab scale

deploymentMode: SingleBinary

loki:
  image:
    registry: docker.io
    repository: grafana/loki
    tag: 3.7.10
    digest: sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
  auth_enabled: false
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    # Keep retention markers on the single-binary persistent volume.
    working_directory: /var/loki/compactor
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem

# --- Single binary (all-in-one) ---
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: longhorn
    size: 10Gi
    # Preserve the existing claim during reviewed maintenance and chart removal.
    whenDeleted: Retain
    whenScaled: Retain

# --- Disable scalable-mode components ---
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# --- Gateway (nginx) ---
gateway:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# --- Disable caches (unnecessary at homelab scale) ---
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# --- Disable canary and tests ---
lokiCanary:
  enabled: false
test:
  enabled: false
