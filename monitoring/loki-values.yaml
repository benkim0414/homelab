# Loki Helm chart values
# Chart: https://grafana.github.io/helm-charts
# Monolithic single-binary mode for homelab scale

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem

# --- Single binary (all-in-one) ---
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi

# --- Disable scalable-mode components ---
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# --- Gateway (nginx) ---
gateway:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# --- Disable caches (unnecessary at homelab scale) ---
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# --- Disable canary and tests ---
lokiCanary:
  enabled: false
test:
  enabled: false
