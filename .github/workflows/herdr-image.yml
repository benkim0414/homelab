name: Build Herdr image
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  packages: write
concurrency:
  group: herdr-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test wrapper and source
        run: |
          python3 -m unittest discover -s verification/tests -p test_herdr.py -v
          bash -n herdr/image/herdr.sh
      - name: Build and smoke test
        run: |
          docker build --build-arg TARGETARCH=amd64 -t "ghcr.io/benkim0414/hermes-herdr:${GITHUB_SHA}" herdr/image
          docker run --rm --entrypoint /usr/local/bin/herdr "ghcr.io/benkim0414/hermes-herdr:${GITHUB_SHA}" --version
          docker run --rm --entrypoint kubectl "ghcr.io/benkim0414/hermes-herdr:${GITHUB_SHA}" version --client
          bash herdr/image/smoke-test.sh "ghcr.io/benkim0414/hermes-herdr:${GITHUB_SHA}"
      - name: Publish tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/benkim0414/hermes-herdr:${GITHUB_SHA}"
          docker image inspect "ghcr.io/benkim0414/hermes-herdr:${GITHUB_SHA}" --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
