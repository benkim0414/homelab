name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Verification checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned verification tools
        run: python3 verification/bootstrap.py
      - name: Test verifier and policies
        run: |
          verification/venv/bin/python -m unittest discover -s verification/tests -v
          verification/cache/bin/conftest verify --policy verification/policy
      - name: Verify all Applications and compare revisions
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          args=(--all)
          base="${PR_BASE:-${PUSH_BASE:-}}"
          if [[ -z "$base" ]]; then
            base="$(git merge-base HEAD origin/main)"
          fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            args+=(--base "$base")
          fi
          verification/venv/bin/python scripts/verify.py "${args[@]}"
      - name: Publish sanitized summary
        if: always()
        run: |
          if [[ -f verification/reports/summary.md ]]; then
            cat verification/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-reports
          path: |
            verification/reports/summary.md
            verification/reports/summary.json
          if-no-files-found: ignore
          retention-days: 7
  verify:
    name: Verify
    if: always()
    needs: [checks]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require successful verification
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
