name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_herdr:
        description: Build, smoke test, publish Herdr and advance its tested deployment digest
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  herdr-image:
    if: github.event_name == 'workflow_dispatch' && inputs.build_herdr
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/herdr-image.yml
  checks:
    name: Verification checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned verification tools
        run: python3 verification/bootstrap.py
      - name: Prepare pinned desktop Langfuse test source
        shell: bash
        run: |
          source_dir=verification/cache/hermes-langfuse-source/plugins/observability/langfuse
          mkdir -p "$source_dir"
          curl --proto '=https' --fail --silent --show-error --max-time 30 \
            --output "$source_dir/__init__.py" \
            https://raw.githubusercontent.com/NousResearch/hermes-agent/2237be355906fbe6065ce1815711eee52b2d646e/plugins/observability/langfuse/__init__.py
          printf '%s  %s\n' 75f0959a4152145a7c33591d6ddd3c4c8bfd53b29e0807f18abdc19bb8a485d1 "$source_dir/__init__.py" | sha256sum --check -
      - name: Test verifier and policies
        env:
          HERMES_TEST_CORE: ${{ github.workspace }}/verification/cache/hermes-langfuse-source
        run: |
          verification/venv/bin/python -m unittest discover -s verification/tests -v
          verification/cache/bin/conftest verify --policy verification/policy
      - name: Test house-manager approval boundaries
        working-directory: hermes/house-manager-tools
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          "$GITHUB_WORKSPACE/verification/venv/bin/python" runtime_context/capture_public_sources.py --upstream
          "$GITHUB_WORKSPACE/verification/venv/bin/python" -m unittest discover -s tests_general -v
          "$GITHUB_WORKSPACE/verification/venv/bin/python" -m unittest test_edit_connector test_general_connector_v3 test_chat_approval_plugin test_chat_approval_flow test_runtime_context test_overlay_bundle test_enroll_chat_approver -v
      - name: Verify all Applications and compare revisions
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          args=(--all)
          base="${PR_BASE:-${PUSH_BASE:-}}"
          if [[ -z "$base" ]]; then
            base="$(git merge-base HEAD origin/main)"
          fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            args+=(--base "$base")
          fi
          verification/venv/bin/python scripts/verify.py "${args[@]}"
      - name: Publish sanitized summary
        if: always()
        run: |
          if [[ -f verification/reports/summary.md ]]; then
            cat verification/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-reports
          path: |
            verification/reports/summary.md
            verification/reports/summary.json
          if-no-files-found: ignore
          retention-days: 7
  verify:
    name: Verify
    if: always()
    needs: [checks]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require successful verification
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
