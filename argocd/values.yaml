# ArgoCD Helm chart values
# Chart: argo/argo-cd
# Repo: https://argoproj.github.io/argo-helm

global:
  logging:
    level: warn

# -- Serve HTTP (Tailscale ingress handles TLS termination)
configs:
  params:
    server.insecure: true
  cm:
    accounts.admin: apiKey, login
    accounts.argocd-mcp: apiKey
  rbac:
    policy.csv: |
      p, role:readonly, applications, get, */*, allow
      p, role:readonly, clusters, get, *, allow
      p, role:readonly, repositories, get, *, allow
      p, role:readonly, logs, get, */*, allow
      p, role:readonly, projects, get, *, allow
      g, argocd-mcp, role:readonly

# -- Controller
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

# -- Server
server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  service:
    type: LoadBalancer
    loadBalancerIP: "192.168.0.202"

# -- Repo server (512Mi needed for kube-prometheus-stack chart rendering)
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

# -- Redis
redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# -- ApplicationSet controller
applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# -- Notifications controller (disabled — not needed yet)
notifications:
  enabled: false

# -- Dex (SSO — disabled, use ArgoCD built-in auth)
dex:
  enabled: false
