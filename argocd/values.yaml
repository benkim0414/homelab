# ArgoCD Helm chart values
# Chart: argo/argo-cd
# Repo: https://argoproj.github.io/argo-helm

global:
  logging:
    level: warn

# -- Serve HTTP (Tailscale ingress handles TLS termination)
configs:
  params:
    server.insecure: true

# -- Controller
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# -- Server
server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  service:
    type: LoadBalancer
    annotations:
      metallb.universe.tf/loadBalancerIPs: "192.168.0.202"

# -- Repo server
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# -- Redis
redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# -- ApplicationSet controller
applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# -- Notifications controller (disabled — not needed yet)
notifications:
  enabled: false

# -- Dex (SSO — disabled, use ArgoCD built-in auth)
dex:
  enabled: false
