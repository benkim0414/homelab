apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    # Helm chart
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: '*'
      helm:
        valueFiles:
          - $repo/monitoring/kube-prometheus-stack-values.yaml
    # Git repo for values file reference
    - repoURL: https://github.com/benkim0414/homelab.git
      targetRevision: HEAD
      ref: repo
    # Raw manifests (Tailscale ingress)
    - repoURL: https://github.com/benkim0414/homelab.git
      targetRevision: HEAD
      path: monitoring
      directory:
        include: '{tailscale-ingress.yaml,prometheus-rules.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    # Grafana admin secret is generated once; ignore drift to prevent perpetual OutOfSync
    - group: ""
      kind: Secret
      name: kube-prometheus-stack-grafana
      jsonPointers:
        - /data/admin-password
        - /data/admin-user
    # Deployment checksum/secret annotation drifts with the secret
    - group: apps
      kind: Deployment
      name: kube-prometheus-stack-grafana
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
---
