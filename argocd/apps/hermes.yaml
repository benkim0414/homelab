apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/benkim0414/homelab.git
    targetRevision: main
    path: hermes
    directory:
      include: '{namespace.yaml,configmap.yaml,deployment.yaml,storage.yaml,network-policy.yaml,tailscale-ingress.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
