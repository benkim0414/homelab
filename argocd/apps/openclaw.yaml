apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/benkim0414/homelab.git
    targetRevision: main
    path: openclaw
    directory:
      include: '{namespace.yaml,configmap.yaml,deployment.yaml,storage.yaml,network-policy.yaml,tailscale-ingress.yaml,gateway-sealed-secret.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
