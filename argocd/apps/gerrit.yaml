apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gerrit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/benkim0414/homelab.git
    targetRevision: main
    path: gerrit
    directory:
      include: '{namespace.yaml,storage.yaml,configmap.yaml,statefulset.yaml,service.yaml,network-policy.yaml,tailscale-ingress.yaml,auth-sealed-secret.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: gerrit
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
