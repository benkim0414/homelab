apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-runner
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    name: in-cluster
    namespace: forgejo-runner
  source:
    repoURL: https://github.com/benkim0414/homelab.git
    targetRevision: HEAD
    path: forgejo-runner
    directory:
      include: '{namespace.yaml,sealed-secret.yaml,configmap.yaml,pvc.yaml,deployment.yaml}'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
