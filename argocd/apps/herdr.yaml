apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: herdr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/benkim0414/homelab.git
    targetRevision: main
    path: herdr
    directory:
      include: '{namespace.yaml,rbac.yaml,access.yaml,storage.yaml,deployment.yaml,network-policy.yaml,service.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: herdr
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
