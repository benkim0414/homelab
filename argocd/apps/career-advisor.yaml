apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: career-advisor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/benkim0414/homelab.git
    targetRevision: main
    path: hermes/profiles/career-advisor
    directory:
      include: resources.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: career-advisor
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
