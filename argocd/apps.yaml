apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/benkim0414/homelab.git
    targetRevision: main
    path: argocd/apps
    directory:
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
