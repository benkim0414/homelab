apiVersion: apps/v1
kind: Deployment
metadata:
  name: honcho-api
  namespace: honcho
spec:
  replicas: 1
  selector:
    matchLabels:
      app: honcho-api
  template:
    metadata:
      labels:
        app: honcho-api
    spec:
      containers:
        - name: api
          # arm64 digest pinned from ghcr.io/plastic-labs/honcho:latest
          image: ghcr.io/plastic-labs/honcho@sha256:f144f135d46a78123d14adbca61ba04cd2d3ee0b67596a2494a095fa5013068b
          # entrypoint.sh runs `python scripts/provision_db.py` (migrations) then starts fastapi
          command: ["sh", "docker/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: honcho-config
            - secretRef:
                name: honcho-secrets
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: honcho-postgres-credentials
                  key: POSTGRES_PASSWORD
            # Interpolated from POSTGRES_PASSWORD above
            - name: DB_CONNECTION_URI
              value: "postgresql+psycopg://honcho:$(POSTGRES_PASSWORD)@honcho-postgres:5432/honcho"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: honcho-api
  namespace: honcho
spec:
  type: ClusterIP
  selector:
    app: honcho-api
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
