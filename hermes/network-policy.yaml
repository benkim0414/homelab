apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app: hermes
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/parent-resource-type: ingress
              tailscale.com/parent-resource: hermes
              tailscale.com/parent-resource-ns: hermes
      ports:
        - protocol: TCP
          port: 9119
  egress:
    # House manager uses official HA MCP. This is pod-wide connectivity;
    # entity/tool restrictions are enforced separately in HA and the profile.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home-assistant
          podSelector:
            matchLabels:
              app.kubernetes.io/name: home-assistant
              app.kubernetes.io/instance: home-assistant
      ports:
        - protocol: TCP
          port: 8123
    - to:
        - podSelector:
            matchLabels:
              app: hermes-browser
      ports:
        - protocol: TCP
          port: 9222
    # Bank selection and bearer authentication remain in the MCP client config.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hindsight
          podSelector:
            matchLabels:
              app: hindsight-api
      ports:
        - protocol: TCP
          port: 8888
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
