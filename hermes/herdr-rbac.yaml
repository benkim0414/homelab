apiVersion: v1
kind: ServiceAccount
metadata:
  name: herdr
  namespace: hermes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: herdr
  namespace: hermes
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  # This is namespace-wide administration, not a label-scoped boundary.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: herdr
  namespace: hermes
subjects:
  - kind: ServiceAccount
    name: herdr
    namespace: hermes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: herdr
