apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-backup
  namespace: hermes
spec:
  schedule: "0 4 * * *"
  timeZone: Australia/Melbourne
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hermes-backup
        spec:
          serviceAccountName: hermes-backup
          # This controller needs only its dedicated, restricted Kubernetes token.
          # It receives no Hermes PVC, OAuth grant or dashboard credentials.
          automountServiceAccountToken: true
          restartPolicy: Never
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: nousresearch/hermes-agent:v0.22.2@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
              command: [/opt/hermes/.venv/bin/python, -B, /scripts/backup.py]
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HERMES_VOLUME
                  value: pvc-d4c53ad4-a9a2-4d28-91a9-0c4e3c884383
                - name: BACKUP_KEEP
                  value: "7"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: hermes-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-backup-recovery
  namespace: hermes
spec:
  schedule: "*/5 * * * *"
  timeZone: Australia/Melbourne
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 90
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hermes-backup
        spec:
          serviceAccountName: hermes-backup-recovery
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recovery
              image: nousresearch/hermes-agent:v0.22.2@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
              command: [/opt/hermes/.venv/bin/python, -B, /scripts/backup.py]
              env:
                - name: BACKUP_MODE
                  value: recover
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HERMES_VOLUME
                  value: pvc-d4c53ad4-a9a2-4d28-91a9-0c4e3c884383
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: hermes-backup
