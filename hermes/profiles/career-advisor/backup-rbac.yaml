apiVersion: v1
kind: ServiceAccount
metadata:
  name: career-advisor-backup
  namespace: career-advisor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: career-advisor-backup-recovery
  namespace: career-advisor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: career-advisor-backup-control
  namespace: career-advisor
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [career-advisor]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [career-advisor]
    verbs: [get, patch]
  # The lease is runtime state, created by the first runner.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [career-advisor-backup]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: career-advisor-backup-control
  namespace: career-advisor
subjects:
  - kind: ServiceAccount
    name: career-advisor-backup
    namespace: career-advisor
  - kind: ServiceAccount
    name: career-advisor-backup-recovery
    namespace: career-advisor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: career-advisor-backup-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: career-advisor-backup-source
  namespace: career-advisor
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [career-advisor-data]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: career-advisor-backup-source
  namespace: career-advisor
subjects:
  - kind: ServiceAccount
    name: career-advisor-backup
    namespace: career-advisor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: career-advisor-backup-source
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: career-advisor-backup
  namespace: longhorn-system
rules:
  - apiGroups: [longhorn.io]
    resources: [volumes]
    resourceNames: [pvc-f4805c89-7cfe-4592-a413-b0ea7f1715af]
    verbs: [get]
  - apiGroups: [longhorn.io]
    resources: [backuptargets]
    resourceNames: [default]
    verbs: [get]
  # RBAC cannot constrain create by resourceNames or restrict list/delete by
  # labels. The runner additionally validates the exact source and policy.
  - apiGroups: [longhorn.io]
    resources: [snapshots, backups]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: career-advisor-backup
  namespace: longhorn-system
subjects:
  - kind: ServiceAccount
    name: career-advisor-backup
    namespace: career-advisor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: career-advisor-backup
