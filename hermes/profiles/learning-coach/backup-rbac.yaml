apiVersion: v1
kind: ServiceAccount
metadata:
  name: learning-coach-backup
  namespace: learning-coach
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: learning-coach-backup-recovery
  namespace: learning-coach
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: learning-coach-backup-control
  namespace: learning-coach
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [learning-coach]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [learning-coach]
    verbs: [get, patch]
  # The lease is runtime state, created by the first runner.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [learning-coach-backup]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: learning-coach-backup-control
  namespace: learning-coach
subjects:
  - kind: ServiceAccount
    name: learning-coach-backup
    namespace: learning-coach
  - kind: ServiceAccount
    name: learning-coach-backup-recovery
    namespace: learning-coach
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: learning-coach-backup-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: learning-coach-backup-source
  namespace: learning-coach
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [learning-coach-data]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: learning-coach-backup-source
  namespace: learning-coach
subjects:
  - kind: ServiceAccount
    name: learning-coach-backup
    namespace: learning-coach
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: learning-coach-backup-source
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: learning-coach-backup
  namespace: longhorn-system
rules:
  - apiGroups: [longhorn.io]
    resources: [volumes]
    resourceNames: [pvc-6fae088c-2245-47aa-82ba-cf48ce7dc8f6]
    verbs: [get]
  - apiGroups: [longhorn.io]
    resources: [backuptargets]
    resourceNames: [default]
    verbs: [get]
  # RBAC cannot constrain create by resourceNames or restrict list/delete by
  # labels. The runner additionally validates the exact source and policy.
  - apiGroups: [longhorn.io]
    resources: [snapshots, backups]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: learning-coach-backup
  namespace: longhorn-system
subjects:
  - kind: ServiceAccount
    name: learning-coach-backup
    namespace: learning-coach
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: learning-coach-backup
