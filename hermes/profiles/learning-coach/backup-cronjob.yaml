apiVersion: batch/v1
kind: CronJob
metadata:
  name: learning-coach-backup
  namespace: learning-coach
spec:
  schedule: "15 4 * * *"
  timeZone: Australia/Melbourne
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: learning-coach-backup
        spec:
          serviceAccountName: learning-coach-backup
          # This controller needs only its dedicated, restricted Kubernetes token.
          # It receives no Hermes PVC, OAuth grant or dashboard credentials.
          automountServiceAccountToken: true
          restartPolicy: Never
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: nousresearch/hermes-agent:v0.23.2@sha256:d6746a084e9341baada483e3d6210444d3c1aeb7c130f0915150065fb2851459
              command: [/opt/hermes/.venv/bin/python, -B, /scripts/backup.py]
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HERMES_VOLUME
                  value: pvc-6fae088c-2245-47aa-82ba-cf48ce7dc8f6
                - name: BACKUP_KEEP
                  value: "7"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: learning-coach-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: learning-coach-backup-recovery
  namespace: learning-coach
spec:
  schedule: "*/5 * * * *"
  timeZone: Australia/Melbourne
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 90
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: learning-coach-backup
        spec:
          serviceAccountName: learning-coach-backup-recovery
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recovery
              image: nousresearch/hermes-agent:v0.23.2@sha256:d6746a084e9341baada483e3d6210444d3c1aeb7c130f0915150065fb2851459
              command: [/opt/hermes/.venv/bin/python, -B, /scripts/backup.py]
              env:
                - name: BACKUP_MODE
                  value: recover
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HERMES_VOLUME
                  value: pvc-6fae088c-2245-47aa-82ba-cf48ce7dc8f6
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: learning-coach-backup
