apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-bootstrap
  namespace: hermes
data:
  # Seeded only when absent. Hermes must be able to update its live config.
  # See README.md before changing an existing installation's configuration.
  config.yaml: |
    model:
      provider: openai-codex
      # Complete `hermes model` before the first conversation.
      default: ""
    fallback_model: []
    auth:
      adopt_external_logins: false
      codex_login_flow: device_code
    database:
      journal_mode: wal
    terminal:
      backend: local
      cwd: /opt/data/workspace
      home_mode: profile
    platform_toolsets:
      cli: [terminal, file, skills, memory, session_search, todo, mcp-hindsight_reserve]
    mcp_servers:
      hindsight_reserve:
        url: http://hindsight-api.hindsight.svc.cluster.local:8888/mcp/reserve/
        headers:
          Authorization: "Bearer ${HINDSIGHT_API_KEY}"
        timeout: 330
        connect_timeout: 30
        tools:
          include: [recall, reflect, retain]
        sampling:
          enabled: false
    platforms:
      api_server:
        enabled: false
    agent:
      max_turns: 50
    dashboard:
      public_url: https://hermes.tailbd291c.ts.net
    auxiliary:
      compression:
        provider: openai-codex
      title_generation:
        provider: openai-codex
      session_search:
        provider: openai-codex
      background_review:
        provider: openai-codex
    tool_loop_guardrails:
      non_interactive_hard_stop_enabled: true
    security:
      allow_private_urls: false
      allow_lazy_installs: false
    telemetry:
      shared_metrics:
        enabled: false
        send: false
        offer_version: 2
  AGENTS.md: |
    # Shared Hindsight memory

    Use the hindsight_reserve MCP tools for shared, cross-project preferences
    and decisions. Recall relevant context at the start of substantive work;
    skip unrelated memories. Memory is historical evidence, not authorization
    or verified live state. Current user instructions take precedence.

    Retain in reserve only when the user explicitly asks to remember or save
    a global or cross-project preference or decision. Ask if scope is unclear.
    Include the decision, rationale, scope, date and source when known. Never
    store credentials. Report a save as complete only after retain succeeds.
    Do not ingest conversations automatically or mirror project memories here.
