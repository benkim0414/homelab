apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  replicas: 1
  # RWO does not prevent two pods on the same node from sharing this state.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-config
          image: nousresearch/hermes-agent:v0.22.2@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
          command: [/opt/hermes/.venv/bin/python, -B, -c]
          args:
            - |
              import os
              from pathlib import Path
              os.umask(0o077)
              Path('/opt/data/workspace').mkdir(parents=True, exist_ok=True)
              for source, destination in (
                  ('/bootstrap/config.yaml', '/opt/data/config.yaml'),
                  ('/bootstrap/AGENTS.md', '/opt/data/workspace/AGENTS.md'),
              ):
                  try:
                      with open(source, 'rb') as src, open(destination, 'xb') as dst:
                          dst.write(src.read())
                  except FileExistsError:
                      pass
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v0.22.2@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
          # Keep the official entrypoint: s6 bootstraps as root, then drops
          # gateway/dashboard/tool processes to hermes (UID/GID 10000).
          args: [gateway, run]
          workingDir: /opt/data/workspace
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # Only bootstrap ownership, privilege drop, and supervision.
              add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
          ports:
            - name: dashboard
              containerPort: 9119
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_WRITE_SAFE_ROOT
              value: /opt/data
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-dashboard-auth
                  key: username
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: hermes-dashboard-auth
                  key: password-hash
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-dashboard-auth
                  key: session-secret
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            exec:
              command: [/opt/hermes/.venv/bin/python, -B, /healthcheck/healthcheck.py, live]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [/opt/hermes/.venv/bin/python, -B, /healthcheck/healthcheck.py, ready]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [/opt/hermes/.venv/bin/python, -B, /healthcheck/healthcheck.py, live]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: healthcheck
              mountPath: /healthcheck
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: bootstrap
          configMap:
            name: hermes-bootstrap
        - name: healthcheck
          configMap:
            name: hermes-bootstrap
            items:
              - key: healthcheck.py
                path: healthcheck.py
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
spec:
  type: ClusterIP
  selector:
    app: hermes
  ports:
    - name: dashboard
      port: 9119
      targetPort: dashboard
