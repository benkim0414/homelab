apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  replicas: 1
  # RWO does not prevent two pods on the same node from sharing this state.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
      annotations:
        checksum/runtime-context: 9c03f37dbec758e274be86c4bb420e39a272ad012a60b203f79e75669b3ffe86
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: verify-runtime-context
          image: nousresearch/hermes-agent:v0.23.2@sha256:d6746a084e9341baada483e3d6210444d3c1aeb7c130f0915150065fb2851459
          command: [/opt/hermes/.venv/bin/python, -B, /runtime-patch/init_overlay.py]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: runtime-context-source
              mountPath: /runtime-patch
              readOnly: true
            - name: runtime-context-overlay
              mountPath: /runtime-overlay
        - name: seed-config
          image: nousresearch/hermes-agent:v0.23.2@sha256:d6746a084e9341baada483e3d6210444d3c1aeb7c130f0915150065fb2851459
          command: [/opt/hermes/.venv/bin/python, -B, -c]
          args:
            - |
              import os
              from pathlib import Path
              os.umask(0o077)
              Path('/opt/data/workspace').mkdir(parents=True, exist_ok=True)
              for source, destination in (
                  ('/bootstrap/config.yaml', '/opt/data/config.yaml'),
                  ('/bootstrap/AGENTS.md', '/opt/data/workspace/AGENTS.md'),
              ):
                  try:
                      with open(source, 'rb') as src, open(destination, 'xb') as dst:
                          dst.write(src.read())
                  except FileExistsError:
                      pass
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v0.23.2@sha256:d6746a084e9341baada483e3d6210444d3c1aeb7c130f0915150065fb2851459
          # Keep the official entrypoint: s6 bootstraps as root, then drops
          # gateway/dashboard/tool processes to hermes (UID/GID 10000).
          args: [gateway, run]
          workingDir: /opt/data/workspace
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # Only bootstrap ownership, privilege drop, and supervision.
              add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
          ports:
            - name: dashboard
              containerPort: 9119
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_WRITE_SAFE_ROOT
              value: /opt/data
            - name: HERMES_LANGFUSE_BASE_URL
              value: http://langfuse-web.langfuse.svc.cluster.local:3000
            - name: HERMES_LANGFUSE_CAPTURE
              value: metadata
            - name: HERMES_LANGFUSE_ENV
              value: homelab-cluster
            - name: HERMES_LANGFUSE_SAMPLE_RATE
              value: "1"
            - name: OTEL_SERVICE_NAME
              value: hermes-cluster
            - name: HERMES_LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-langfuse
                  key: public-key
            - name: HERMES_LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-langfuse
                  key: secret-key
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-dashboard-auth
                  key: username
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: hermes-dashboard-auth
                  key: password-hash
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-dashboard-auth
                  key: session-secret
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            exec:
              command: [/opt/hermes/.venv/bin/python, -B, /healthcheck/healthcheck.py, live]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [/opt/hermes/.venv/bin/python, -B, /healthcheck/healthcheck.py, ready]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [/opt/hermes/.venv/bin/python, -B, /healthcheck/healthcheck.py, live]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: healthcheck
              mountPath: /healthcheck
              readOnly: true
            - name: langfuse-credentials
              mountPath: /var/run/hermes-langfuse
              readOnly: true
            - name: langfuse-key-source
              mountPath: /langfuse-key-source
              readOnly: true
            - name: runtime-context-overlay
              mountPath: /opt/hermes/gateway/session_policy.py
              subPath: gateway/session_policy.py
              readOnly: true
            - name: runtime-context-overlay
              mountPath: /opt/hermes/gateway/session_commands.py
              subPath: gateway/session_commands.py
              readOnly: true
            - name: runtime-context-overlay
              mountPath: /opt/hermes/hermes_cli/plugin_session.py
              subPath: hermes_cli/plugin_session.py
              readOnly: true
            - name: runtime-context-overlay
              mountPath: /opt/hermes/hermes_cli/plugins_context.py
              subPath: hermes_cli/plugins_context.py
              readOnly: true
            - name: runtime-context-overlay
              mountPath: /opt/hermes/gateway/plugin_command_choice.py
              subPath: gateway/plugin_command_choice.py
              readOnly: true
      volumes:
        - name: runtime-context-source
          configMap:
            name: hermes-runtime-context-9c03f37dbec7
            defaultMode: 0444
        - name: runtime-context-overlay
          emptyDir:
            sizeLimit: 8Mi
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: bootstrap
          configMap:
            name: hermes-bootstrap
        - name: healthcheck
          configMap:
            name: hermes-bootstrap
            items:
              - key: healthcheck.py
                path: healthcheck.py
        - name: langfuse-credentials
          secret:
            secretName: hermes-langfuse
            defaultMode: 0440
            items:
              - key: public-key
                path: public-key
              - key: secret-key
                path: secret-key
        - name: langfuse-key-source
          configMap:
            name: hermes-langfuse-key-source
            defaultMode: 0444
            items:
              - key: langfuse-key-source.py
                path: langfuse-key-source.py
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
spec:
  type: ClusterIP
  selector:
    app: hermes
  ports:
    - name: dashboard
      port: 9119
      targetPort: dashboard
