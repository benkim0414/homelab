cronjob:
  schedule: "0 4 * * *"
  timeZone: "Australia/Melbourne"
  concurrencyPolicy: Forbid
  suspend: false
  jobRestartPolicy: Never
  # Chart uses a truthiness guard; a string preserves an explicit zero in YAML.
  jobBackoffLimit: "0"
  activeDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

envFrom:
  - secretRef:
      name: renovate-token

env:
  LOG_FORMAT: json
  LOG_LEVEL: info

nodeSelector:
  kubernetes.io/arch: amd64

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

renovate:
  configIsJson5: true
  config: |
    {
      platform: "github",
      repositories: ["benkim0414/homelab"],
      onboarding: false,
      requireConfig: "required",
      exitCodeForErrors: true,
      dependencyDashboard: { enabled: true },
      gitAuthor: "Renovate Bot <bot@renovateapp.com>"
    }
