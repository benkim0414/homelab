[features]
hooks = true

[shell_environment_policy.set]
CODEX_GIT_WORKFLOW = "no-pr"

[mcp_servers.kubernetes]
command = "npx"
args = ["-y", "kubernetes-mcp-server@latest"]
disabled_tools = ["pods_delete", "resources_delete"]

[mcp_servers.grafana]
command = "mise"
args = ["exec", "--", "uvx", "mcp-grafana"]
env_vars = ["GRAFANA_SERVICE_ACCOUNT_TOKEN"]

[mcp_servers.grafana.env]
GRAFANA_URL = "http://192.168.0.203"

[mcp_servers.argocd]
command = "npx"
args = ["-y", "argocd-mcp@latest", "stdio"]
env_vars = ["ARGOCD_API_TOKEN"]
disabled_tools = ["delete_application"]

[mcp_servers.argocd.env]
ARGOCD_BASE_URL = "http://192.168.0.202"

[mcp_servers.aws_iam]
command = "mise"
args = ["exec", "--", "uvx", "awslabs.iam-mcp-server@latest", "--allow-write"]
disabled_tools = [
  "delete_user",
  "delete_role",
  "delete_group",
  "remove_user_from_group",
  "detach_group_policy",
  "detach_user_policy",
  "delete_access_key",
  "delete_user_policy",
  "delete_role_policy",
]

[mcp_servers.aws_iam.env]
AWS_PROFILE = "default"
AWS_REGION = "ap-southeast-2"
FASTMCP_LOG_LEVEL = "ERROR"

[mcp_servers.aws_s3]
command = "mise"
args = ["exec", "--", "uvx", "awslabs.aws-api-mcp-server@latest"]

[mcp_servers.aws_s3.env]
AWS_PROFILE = "default"
AWS_API_MCP_PROFILE_NAME = "default"
AWS_REGION = "ap-southeast-2"
AWS_API_MCP_ALLOW_UNRESTRICTED_LOCAL_FILE_ACCESS = "workdir"
