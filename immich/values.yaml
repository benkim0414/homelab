# Immich Helm chart values
# Chart: oci://ghcr.io/immich-app/immich-charts/immich
# Version: 0.11.1 (appVersion v2.6.3)

# -- Shared env vars (applied to all components)
controllers:
  main:
    containers:
      main:
        image:
          tag: v2.7.5
        env:
          DB_HOSTNAME: immich-postgres
          DB_PORT: "5432"
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-db-credentials
                key: POSTGRES_USER
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-db-credentials
                key: POSTGRES_PASSWORD
          DB_DATABASE_NAME:
            valueFrom:
              secretKeyRef:
                name: immich-db-credentials
                key: POSTGRES_DB
          IMMICH_MACHINE_LEARNING_URL: "false"

# -- Photo library storage (NFS)
immich:
  persistence:
    library:
      existingClaim: immich-library

# -- Valkey (Redis-compatible) for job queue
valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            limits:
              memory: 128Mi

# -- Immich server
server:
  enabled: true
  service:
    main:
      type: LoadBalancer
      loadBalancerIP: "192.168.0.201"
  controllers:
    main:
      containers:
        main:
          probes:
            startup:
              spec:
                # Node.js module loading is slow under memory pressure (Longhorn
                # instance managers consume ~4 GB on this node, leaving little
                # page-cache headroom). 60 * 10s = 10 min gives enough runway.
                failureThreshold: 60

# -- Machine learning (disabled to conserve RAM)
machine-learning:
  enabled: false
