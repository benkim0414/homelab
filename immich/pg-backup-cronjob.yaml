apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-pg-backup
  namespace: immich
  labels:
    app: immich-pg-backup
spec:
  schedule: "0 3 * * *"
  timeZone: Australia/Melbourne
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: immich-pg-backup
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pg-backup
              image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  umask 077
                  mkdir -p /backups/scheduled
                  TIMESTAMP=$(date -u +%Y%m%dT%H%M%S%NZ)
                  BACKUP_FILE="/backups/scheduled/immich-${TIMESTAMP}.dump"
                  PARTIAL="${BACKUP_FILE}.partial"
                  trap 'rm -f "$PARTIAL"' EXIT
                  pg_dump -h immich-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f "$PARTIAL"
                  test -s "$PARTIAL"
                  pg_restore --list "$PARTIAL" >/dev/null
                  mv "$PARTIAL" "$BACKUP_FILE"
                  sha256sum "$BACKUP_FILE"
                  # Only this new directory participates in retention.
                  if (( BACKUP_KEEP > 0 )); then
                    mapfile -t BACKUPS < <(find /backups/scheduled -maxdepth 1 -type f -name 'immich-*.dump' | sort -r)
                    for OLD in "${BACKUPS[@]:BACKUP_KEEP}"; do rm -- "$OLD"; done
                  fi
              envFrom:
                - secretRef:
                    name: immich-db-credentials
              env:
                - name: BACKUP_KEEP
                  value: "7"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-credentials
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: immich-backups
