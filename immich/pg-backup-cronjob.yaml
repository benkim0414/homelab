apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-pg-backup
  namespace: immich
  labels:
    app: immich-pg-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: immich-pg-backup
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="/backups/immich-${TIMESTAMP}.dump"
                  echo "Starting backup: ${BACKUP_FILE}"
                  pg_dump -h immich-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f "$BACKUP_FILE"
                  echo "Backup complete: $(du -h "$BACKUP_FILE" | cut -f1)"

                  # Retain only the last 7 backups
                  echo "Cleaning up old backups..."
                  ls -1t /backups/immich-*.dump 2>/dev/null | tail -n +8 | xargs -r rm -v
                  echo "Current backups:"
                  ls -lh /backups/immich-*.dump
              envFrom:
                - secretRef:
                    name: immich-db-credentials
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-credentials
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              nfs:
                server: 192.168.0.40
                path: /k3s-storage/immich/backups
